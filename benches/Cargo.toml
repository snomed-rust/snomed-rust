# Criterion benchmarks for this workspace, per spec/rust-bench.md.
#
# Like `fuzz/`, this package sits OUTSIDE the workspace (note the empty
# `[workspace]` table): criterion is an external dependency, and the rule in
# CLAUDE.md is that the published crates have none — not even a dev one that
# every `cargo test` would have to build.
[package]
name = "snomed-benches"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.98"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only OR OGL-UK-3.0 OR CC-BY-NC-SA-4.0"

[workspace]

[dependencies]
snomed-core = { path = "../snomed-core" }
snomed-owl = { path = "../snomed-owl" }
snomed-rf2 = { path = "../snomed-rf2" }
snomed-store = { path = "../snomed-store" }

[dev-dependencies]
criterion = "0.8"
snomed-classify = { path = "../snomed-classify" }
snomed-ecl = { path = "../snomed-ecl" }
snomed-fhir = { path = "../snomed-fhir" }

[lib]
name = "snomed_benches"
path = "src/lib.rs"
bench = false

[[bench]]
name = "sctid"
harness = false

[[bench]]
name = "rf2"
harness = false

[[bench]]
name = "store"
harness = false

[[bench]]
name = "ecl"
harness = false

[[bench]]
name = "classify"
harness = false

[[bench]]
name = "fhir"
harness = false

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[profile.mutants]
inherits = "test"
debug = "none"
incremental = false
