# Criterion benchmarks for this workspace, per spec/rust-bench.md.
#
# Like `fuzz/`, this package sits OUTSIDE the workspace (note the empty
# `[workspace]` table): criterion is an external dependency, and the rule in
# CLAUDE.md is that the published crates have none — not even a dev one that
# every `cargo test` would have to build.
[package]
name = "snomed-benches"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.96"
license = "Apache-2.0 OR MIT"

[workspace]

[dependencies]
snomed-classify = { path = "../snomed-classify" }
snomed-core = { path = "../snomed-core" }
snomed-ecl = { path = "../snomed-ecl" }
snomed-fhir = { path = "../snomed-fhir" }
snomed-owl = { path = "../snomed-owl" }
snomed-rf2 = { path = "../snomed-rf2" }
snomed-store = { path = "../snomed-store" }

[dev-dependencies]
criterion = "0.8"

[lib]
name = "snomed_benches"
path = "src/lib.rs"
bench = false

[[bench]]
name = "sctid"
harness = false

[[bench]]
name = "rf2"
harness = false

[[bench]]
name = "store"
harness = false

[[bench]]
name = "ecl"
harness = false

[[bench]]
name = "classify"
harness = false

[[bench]]
name = "fhir"
harness = false
