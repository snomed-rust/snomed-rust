[workspace]
resolver = "2"
members = [
    "crates/snomed",
    "crates/snomed-core",
    "crates/snomed-rf2",
    "crates/snomed-store",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/joelparkerhenderson/snomed-rust"
keywords = ["snomed", "snomed-ct", "healthcare", "terminology", "rf2"]
categories = ["science", "parser-implementations"]
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]

[workspace.dependencies]
snomed-core = { path = "crates/snomed-core", version = "0.1.0" }
snomed-rf2 = { path = "crates/snomed-rf2", version = "0.1.0" }
snomed-store = { path = "crates/snomed-store", version = "0.1.0" }
