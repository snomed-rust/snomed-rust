[workspace]
resolver = "2"
members = [
    "snomed",
    "snomed-classify",
    "snomed-cli",
    "snomed-core",
    "snomed-ecl",
    "snomed-fhir",
    "snomed-owl",
    "snomed-rf2",
    "snomed-store",
]

[workspace.package]
version = "0.57.0"
edition = "2021"
rust-version = "1.98"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only OR OGL-UK-3.0 OR CC-BY-SA-4.0"
repository = "https://github.com/snomed-rust/snomed-rust"
keywords = ["snomed", "snomed-ct", "healthcare", "terminology", "rf2"]
categories = ["science", "parser-implementations"]
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]

[workspace.dependencies]
snomed-classify = { path = "snomed-classify", version = "0.57.0" }
snomed-core = { path = "snomed-core", version = "0.57.0" }
snomed-ecl = { path = "snomed-ecl", version = "0.57.0" }
snomed-fhir = { path = "snomed-fhir", version = "0.57.0" }
snomed-owl = { path = "snomed-owl", version = "0.57.0" }
snomed-rf2 = { path = "snomed-rf2", version = "0.57.0" }
snomed-store = { path = "snomed-store", version = "0.57.0" }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

# cargo-mutants builds every mutant once in a throwaway copy of the tree: no debug information and no
# incremental state make each build quicker and smaller. `.cargo/mutants.toml` selects it.
[profile.mutants]
inherits = "test"
debug = "none"
incremental = false

# RCA-ENF-4: overflow checks are a backstop in release builds.
[profile.release]
overflow-checks = true
