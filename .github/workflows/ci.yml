name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      # ubuntu-latest ships ~75 GB of preinstalled toolchains this workflow
      # never touches (a full .NET SDK, the Android SDK, GHC, CodeQL, Docker
      # images). Reclaiming that headroom before anything else runs is cheap
      # insurance against "No space left on device" on a Rust build, which
      # tends to write a lot of debug-info-laden target/ output.
      - name: Free preinstalled runner bloat for headroom
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # The workspace only; `fuzz/` and `benches/` are separate packages
      # (spec/rust-fuzz.md, spec/rust-bench.md) and are checked in their
      # own jobs below, where their toolchains are already installed.
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

      # This workspace has zero external dependencies (CLAUDE.md rule 2), so
      # target/ here is overwhelmingly our own nine crates' build output —
      # code that changes on nearly every commit, so caching it buys little
      # and its debug/incremental artifacts are the bulk of what actions/
      # cache would upload. --workspace scopes the clean to this Cargo.toml's
      # members and leaves anything else (there is nothing else) alone.
      - name: Clean workspace-member artifacts before caching
        run: cargo clean --workspace

  trademarks:
    name: Trademark notices (rule 5 of the professionalization spec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Notice presence per spec/professionalization/index.md: every root
      # document, help/ document, and crate-root rustdoc whose prose uses
      # the SNOMED marks carries the verbatim notice. Python 3 only, no
      # toolchain needed.
      - name: Check trademark notices
        run: bin/check-trademarks

  docs:
    name: Docs budget and link integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Per spec/docs-budget-and-links/index.md: every tracked markdown
      # document stays within 40 KB, and every relative link resolves.
      # Python 3 only, no toolchain needed.
      - name: Check document budgets and relative links
        run: bin/check-docs

  msrv:
    name: MSRV (current stable minus 2)
    runs-on: ubuntu-latest
    steps:
      # See the `test` job above for what this reclaims and why.
      - name: Free preinstalled runner bloat for headroom
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4

      # Per spec/rust-msrv-n-minus-2/index.md: MSRV is the current stable
      # release minus two. Keep this pin and `rust-version` in Cargo.toml in
      # step.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.100

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-

      - name: Check with the MSRV toolchain
        run: cargo check --all-targets --workspace

      # See the `test` job above for why this workspace's target/ is worth
      # emptying before it gets cached rather than kept around.
      - name: Clean workspace-member artifacts before caching
        run: cargo clean --workspace

  fuzz:
    name: Fuzz targets (build + smoke run)
    runs-on: ubuntu-latest
    steps:
      # See the `test` job's step of the same name for what this reclaims
      # and why. Sanitizer-instrumented builds across 13 targets are the
      # most disk-hungry job in this workflow, so the headroom matters most
      # here.
      - name: Free preinstalled runner bloat for headroom
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4

      # libfuzzer-sys needs nightly; see spec/rust-fuzz.md for why `fuzz/`
      # is its own package outside the workspace. rustfmt and clippy are
      # named explicitly: this action installs a minimal toolchain, and the
      # fmt and clippy steps below run on nightly (it is the only toolchain
      # this job installs) — without the components both fail with
      # "'cargo-fmt' is not installed for the toolchain 'nightly'".
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-fuzz
            fuzz/target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('fuzz/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked || true

      - name: Check formatting
        working-directory: fuzz
        run: cargo fmt --all -- --check

      - name: Clippy (warnings are errors)
        working-directory: fuzz
        run: cargo +nightly clippy --all-targets -- -D warnings

      - name: Build every target
        working-directory: fuzz
        run: cargo +nightly fuzz build

      # A smoke test over the committed seeds, not a fuzzing campaign
      # (spec/rust-fuzz.md): it proves the targets still run and the seeds
      # are clean. Long campaigns run elsewhere.
      - name: Run each target briefly
        working-directory: fuzz
        run: |
          for target in $(cargo +nightly fuzz list); do
            echo "::group::$target"
            # corpus/ is generated and gitignored (spec/rust-fuzz.md), so it
            # does not exist in a fresh checkout; libFuzzer errors on a
            # missing corpus directory rather than creating one.
            mkdir -p "corpus/$target"
            seeds="seeds/$target"
            [ -d "$seeds" ] || seeds=""
            cargo +nightly fuzz run "$target" "corpus/$target" $seeds -- \
              -max_total_time=20 -rss_limit_mb=4096 -timeout=10
            echo "::endgroup::"
          done

      # Unlike the `test`/`msrv` jobs, fuzz/ has real external dependencies
      # (libfuzzer-sys and its own tree) worth keeping cached — `--workspace`
      # here scopes the clean to fuzz/Cargo.toml's one member, `snomed-fuzz`
      # itself, which is the only part of this target/ that changes on
      # nearly every commit. Everything else it built stays cached.
      - name: Clean the fuzz package's own artifacts before caching
        working-directory: fuzz
        run: cargo clean --workspace

  bench:
    name: Benchmarks (compile + smoke run)
    runs-on: ubuntu-latest
    steps:
      # See the `test` job's step of the same name for what this reclaims
      # and why.
      - name: Free preinstalled runner bloat for headroom
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            benches/target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('benches/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      - name: Check formatting
        run: cargo fmt --all --manifest-path benches/Cargo.toml -- --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets --manifest-path benches/Cargo.toml -- -D warnings

      # Shared runners are too noisy to time anything (spec/rust-bench.md):
      # `--test` runs each case once, proving the benchmarks still work.
      - name: Smoke-run the benchmarks
        run: cargo bench --manifest-path benches/Cargo.toml --benches -- --test

      # Verified locally (2026-08-28): this dropped benches/target from
      # 2.0 GiB to 1.3 GiB, removing all 772.8 MiB of snomed-benches's own
      # artifacts while leaving criterion and the path-dependency workspace
      # crates it benchmarks (snomed-core and friends, real recompile cost)
      # intact — `--workspace` scopes to benches/Cargo.toml's one member.
      - name: Clean the benches package's own artifacts before caching
        run: cargo clean --workspace --manifest-path benches/Cargo.toml
