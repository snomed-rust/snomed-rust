# Dependabot scheduled update PRs, per spec/dependabot/index.md.
#
# Three separate cargo roots, matching the three cargo packages this repo
# actually builds (CLAUDE.md "Rules that matter here" #2): the workspace
# at "/", and `fuzz/` and `benches/`, which are deliberately kept outside
# the workspace so the zero-dependency crates never pull in their deps.
# Plus one "github-actions" entry for the workflow action versions.

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/benches"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # dtolnay/rust-toolchain@1.96 in the msrv job: that ref IS the Rust
      # toolchain version the action installs, not just the action's own
      # revision. Dependabot's github-actions updater does not know the
      # difference and will walk it toward the newest tag in that repo,
      # which can be a not-yet-released Rust version — confirmed live on
      # 2026-08-30, when it bumped this pin to 1.100 and broke the msrv
      # job (rustup: "could not download nonexistent rust version
      # 1.100.0"). This pin moves only by hand, in the same change that
      # recomputes MSRV per spec/rust-msrv-n-minus-2/index.md.
      - dependency-name: "dtolnay/rust-toolchain"
